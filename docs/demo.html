<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麦麦省钱助手 · 在线试算</title>
<style>
  :root { --red:#c2410c; --amber:#f59e0b; --bg:#fff7ed; --card:#ffffff; --text:#292524; --muted:#78716c; --line:#e7e5e4; --green:#16a34a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "PingFang SC","Microsoft YaHei",system-ui,sans-serif; background:var(--bg); color:var(--text); padding:24px 16px 64px; }
  .wrap { max-width: 860px; margin: 0 auto; }
  header { text-align:center; margin-bottom:20px; }
  header h1 { font-size:26px; color:var(--red); }
  header p { color:var(--muted); font-size:13px; margin-top:6px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .card h2 { font-size:15px; margin-bottom:10px; color:var(--red); }
  .items { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:8px; }
  .item { display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13px; }
  .item .name { flex:1; }
  .item .price { color:var(--muted); white-space:nowrap; }
  .qty { width:44px; text-align:center; border:1px solid var(--line); border-radius:6px; padding:2px; }
  button.calc { width:100%; padding:12px; font-size:15px; font-weight:bold; color:#fff; background:var(--red); border:none; border-radius:10px; cursor:pointer; }
  button.calc:hover { background:#9a3412; }
  .plan { border:1px solid var(--line); border-radius:10px; padding:12px; margin-top:10px; font-size:13px; }
  .plan.best { border-color:var(--green); background:#f0fdf4; }
  .plan .head { display:flex; justify-content:space-between; font-weight:bold; margin-bottom:6px; }
  .plan .best-tag { color:var(--green); }
  .bar { height:8px; background:var(--line); border-radius:4px; overflow:hidden; margin-top:8px; }
  .bar > div { height:100%; background:linear-gradient(90deg,var(--amber),var(--red)); }
  .note { color:var(--muted); font-size:12px; margin-top:6px; }
  footer { text-align:center; color:var(--muted); font-size:12px; margin-top:24px; line-height:1.8; }
  a { color:var(--red); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🍟 麦麦省钱助手 · 在线试算</h1>
    <p>券组合优化算法前端复刻 —— 选好想吃的，一键算出最优方案与凑单陷阱</p>
  </header>

  <div class="card">
    <h2>① 选择想吃的（示例菜单）</h2>
    <div class="items" id="menu"></div>
  </div>

  <div class="card">
    <h2>② 可用券（自动参与组合优化）</h2>
    <div id="coupons" class="note" style="font-size:13px;color:var(--text)"></div>
  </div>

  <button class="calc" onclick="calc()">🧮 计算最优方案</button>
  <div id="result"></div>

  <footer>
    示例数据仅用于演示算法，实时菜单/价格/优惠以麦当劳官方 App 与 MCP 工具返回为准。<br>
    本页为 <a href="https://github.com/yuxinlaile/maimai-saver">maimai-saver</a> 项目的静态演示，
    社区开源项目，与麦当劳公司无关联。
  </footer>
</div>

<script>
// 与 scripts/optimizer.py 相同的示例数据与算法
const MENU = [
  {mealCode:"M1", name:"巨无霸", price:25.0},
  {mealCode:"M2", name:"麦辣鸡腿堡", price:22.0},
  {mealCode:"M3", name:"中薯条", price:12.0},
  {mealCode:"M4", name:"中可乐", price:9.5},
  {mealCode:"M5", name:"麦辣鸡腿堡三件套(堡+中薯+中可)", price:33.5},
  {mealCode:"M6", name:"1+1随心配(任选两件)", price:13.5},
  {mealCode:"M7", name:"脆薯饼", price:7.0},
];
const COUPONS = [
  {couponId:"C3", title:"满30减6", threshold:30, discount:6},
  {couponId:"C1", title:"到店取餐9折券", threshold:0, discount:3.35},
  {couponId:"C2", title:"满40减10", threshold:40, discount:10},
];
const ADDON_LIMIT = 3;

const menuEl = document.getElementById("menu");
MENU.forEach(m => {
  const div = document.createElement("label");
  div.className = "item";
  div.innerHTML = `<input type="checkbox" value="${m.mealCode}">
    <span class="name">${m.name}</span>
    <span class="price">¥${m.price.toFixed(2)}</span>
    <input class="qty" type="number" min="1" value="1">`;
  menuEl.appendChild(div);
});
document.getElementById("coupons").innerHTML = COUPONS.map(c =>
  `· ${c.title}（满 ${c.threshold} 减 ${c.discount}）`).join("<br>");

const priceOf = code => (MENU.find(m => m.mealCode === code) || {price:0}).price;
const nameOf = code => (MENU.find(m => m.mealCode === code) || {name:code}).name;

function selectedWants() {
  const wants = [];
  document.querySelectorAll(".item").forEach(row => {
    const cb = row.querySelector("input[type=checkbox]");
    if (cb.checked) {
      const qty = Math.max(1, parseInt(row.querySelector(".qty").value || "1", 10));
      wants.push({mealCode: cb.value, quantity: qty});
    }
  });
  return wants;
}

function faceOf(entries) {
  return entries.reduce((s, e) => s + priceOf(e.mealCode) * e.quantity, 0);
}

function calc() {
  const wants = selectedWants();
  const resultEl = document.getElementById("result");
  if (!wants.length) { resultEl.innerHTML = `<div class="plan note">请先勾选想吃的餐品。</div>`; return; }

  const baseFace = faceOf(wants);
  const baseline = baseFace; // 无券直点
  const plans = [{label:"无券直点", entries:wants, note:"", payable:baseline}];
  const addons = MENU.filter(m => !wants.some(w => w.mealCode === m.mealCode))
                     .sort((a,b) => a.price - b.price).slice(0, ADDON_LIMIT);

  COUPONS.forEach(c => {
    if (c.threshold <= 0 || baseFace >= c.threshold) {
      plans.push({label:c.title, entries:wants, note:"", payable:Math.max(0, baseFace - c.discount)});
    } else {
      const addon = addons.find(a => baseFace + a.price >= c.threshold);
      if (addon) {
        const entries = wants.map(e => ({...e}));
        const hit = entries.find(e => e.mealCode === addon.mealCode);
        if (hit) hit.quantity += 1; else entries.push({mealCode:addon.mealCode, quantity:1});
        plans.push({label:c.title, entries, note:`凑单:+${addon.name}`,
                    payable:Math.max(0, faceOf(entries) - c.discount)});
      }
    }
  });

  plans.sort((a,b) => a.payable - b.payable || a.entries.length - b.entries.length);
  const best = plans[0].payable;
  const maxSave = baseline - plans[plans.length-1].payable || 1;

  resultEl.innerHTML = plans.slice(0, 4).map((p, i) => {
    const save = baseline - p.payable;
    const pct = baseline ? (save / baseline * 100) : 0;
    const detail = p.entries.map(e => `${nameOf(e.mealCode)}×${e.quantity}`).join(" + ");
    return `<div class="plan ${i===0 ? "best" : ""}">
      <div class="head"><span>${i+1}. ${p.label}</span>
        <span>实付 ¥${p.payable.toFixed(2)} ${i===0 ? '<span class="best-tag">← 最优</span>' : ""}</span></div>
      <div>${detail}</div>
      <div class="note">较无券直点省 ¥${save.toFixed(2)}（${pct.toFixed(0)}%）</div>
      ${p.note ? `<div class="note">⚠️ ${p.note}——仅当你本来就需要该商品才划算</div>` : ""}
      <div class="bar"><div style="width:${Math.max(4, (baseline - p.payable) / (baseline - best || 1) * 100)}%"></div></div>
    </div>`;
  }).join("");
}
</script>
</body>
</html>
