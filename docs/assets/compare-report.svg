    <text x="24" y="134" fill="#585b70">========================================================================</text>
    <text x="24" y="156">官方渠道方案：商品合计原价 <tspan fill="#f9e2af">¥48.50</tspan>，MCP 带券最优实付 <tspan fill="#f9e2af">¥38.50</tspan>（折扣率 79.4%）</text>
    <text x="24" y="188">团购券比价（按估算到手价升序，所有金额均为估算值）：</text>
