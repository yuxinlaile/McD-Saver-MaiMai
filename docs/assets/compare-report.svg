    <text x="24" y="327">      售价 ¥29.90 / 面值 ¥41.00 = 折扣率 72.9% | 同内容估算到手 <tspan fill="#a6e3a1">¥35.37</tspan> | 对比官方 +3.13 元</text>
    <text x="24" y="350" fill="#9399b2">      限制: 仅堂食核销；2026-12-31前有效</text>
