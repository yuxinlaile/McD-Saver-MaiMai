  <text x="20" y="90" fill="#cdd6f4" font-size="13" xml:space="preserve">麦麦省钱助手 · 省钱四步检查 全链路演示（离线 fixtures 模式）</text>
  <text x="20" y="112" fill="#cdd6f4" font-size="13" xml:space="preserve">数据快照：2026-10-12 · 字段结构与真实 MCP 响应一致 · 业务逻辑零改动</text>
