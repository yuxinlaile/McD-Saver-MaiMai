  <text x="20" y="794" fill="#a6e3a1" font-size="13" xml:space="preserve">  · 满40减10 ｜ ¥10.00 ｜ 还剩 5 天</text>
  <text x="20" y="816" fill="#cdd6f4" font-size="13" xml:space="preserve">  合计面值：¥19.35</text>
  <text x="20" y="838" fill="#f38ba8" font-size="13" xml:space="preserve">  建议：优先用掉临期券——过期即沉没，凑单达标也比浪费划算。</text>
  <text x="20" y="860" fill="#89b4fa" font-size="13" xml:space="preserve">【一·B】用券排程（窗口 1 天 × 频率 0.103 单/天 ≈ 1 单）</text>
  <text x="20" y="882" fill="#cdd6f4" font-size="13" xml:space="preserve">  券不是越多越好，用得上才算数：</text>
  <text x="20" y="904" fill="#a6e3a1" font-size="13" xml:space="preserve">    第 1 单 → 满40减10 ｜ 还剩 5 天 ｜ 净用掉 ¥10.00</text>
  <text x="20" y="926" fill="#f38ba8" font-size="13" xml:space="preserve">  排不上（注定随券过期浪费 ¥9.35）：</text>
  <text x="20" y="948" fill="#a6e3a1" font-size="13" xml:space="preserve">    · 满30减6 ｜ ¥6.00 ｜ 还剩 1 天</text>
  <text x="20" y="970" fill="#a6e3a1" font-size="13" xml:space="preserve">    · 到店取餐9折券 ｜ ¥3.35 ｜ 还剩 2 天</text>
