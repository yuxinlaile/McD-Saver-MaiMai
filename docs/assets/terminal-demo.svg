  <text x="20" y="156" fill="#cdd6f4" font-size="13" xml:space="preserve"></text>
  <text x="20" y="178" fill="#89b4fa" font-size="13" xml:space="preserve">【领券前置】可领取的券（免费，不领白不领）</text>
  <text x="20" y="200" fill="#cdd6f4" font-size="13" xml:space="preserve">  共 3 张可领：</text>
  <text x="20" y="222" fill="#a6e3a1" font-size="13" xml:space="preserve">    · 免费脆薯饼（商品码 M7，菜单可匹配，领取后可实测价值）</text>
  <text x="20" y="244" fill="#a6e3a1" font-size="13" xml:space="preserve">    · 人气麦旋风买一送一（【无法判断】菜单快照中无对应商品——我们不猜，领取后可用「带券计价」实测）</text>
  <text x="20" y="266" fill="#a6e3a1" font-size="13" xml:space="preserve">    · 9.9元中杯冰美式（【无法判断】菜单快照中无对应商品——我们不猜，领取后可用「带券计价」实测）</text>
  <text x="20" y="288" fill="#cdd6f4" font-size="13" xml:space="preserve">  真实运行时此清单来自 auto-bind-coupons / available-coupons 实时返回。</text>
  <text x="20" y="310" fill="#cdd6f4" font-size="13" xml:space="preserve"></text>
  <text x="20" y="332" fill="#89b4fa" font-size="13" xml:space="preserve">【选券】账户当前可用券 3 张：</text>
  <text x="20" y="354" fill="#a6e3a1" font-size="13" xml:space="preserve">    · 满30减6 ｜ 面值 ¥6.00 ｜ 有效期至 2026-10-13</text>
  <text x="20" y="376" fill="#a6e3a1" font-size="13" xml:space="preserve">    · 到店取餐9折券 ｜ 面值 ¥3.35 ｜ 有效期至 2026-10-14</text>
  <text x="20" y="398" fill="#a6e3a1" font-size="13" xml:space="preserve">    · 满40减10 ｜ 面值 ¥10.00 ｜ 有效期至 2026-10-17</text>
  <text x="20" y="420" fill="#cdd6f4" font-size="13" xml:space="preserve"></text>
  <text x="20" y="442" fill="#89b4fa" font-size="13" xml:space="preserve">【比价】想吃「堡+薯+可乐」——估算模式（本地计价，未经验证）</text>
  <text x="20" y="464" fill="#cdd6f4" font-size="13" xml:space="preserve">  基准（无券直点单点组合）：¥43.50</text>
  <text x="20" y="486" fill="#a6e3a1" font-size="13" xml:space="preserve">  1. 无券直点（改点套餐:麦辣鸡腿堡三件套(堡+中薯+中可)（覆盖全部想吃单品）） ｜ 实付 ¥33.50 ｜ 省 ¥10.00  ← 最优</text>
  <text x="20" y="508" fill="#cdd6f4" font-size="13" xml:space="preserve">  2. 无券直点 ｜ 实付 ¥43.50 ｜ 省 ¥0.00</text>
  <text x="20" y="530" fill="#cdd6f4" font-size="13" xml:space="preserve">  同样吃到「堡+薯+可乐」：单点 ¥43.5，改点套餐 ¥33.5，差 ¥10——这就是算法要找的 gap。</text>
  <text x="20" y="552" fill="#cdd6f4" font-size="13" xml:space="preserve">  真实运行时每个候选都经官方 calculate-price 逐方案核价后才能作为下单依据。</text>
  <text x="20" y="574" fill="#cdd6f4" font-size="13" xml:space="preserve"></text>
  <text x="20" y="596" fill="#89b4fa" font-size="13" xml:space="preserve">【积分评估】</text>
  <text x="20" y="618" fill="#cdd6f4" font-size="13" xml:space="preserve">  可用积分 1200，本月将过期 300。</text>
  <text x="20" y="640" fill="#a6e3a1" font-size="13" xml:space="preserve">  积分影子价格：最优「中杯鲜煮咖啡券」= 0.0210 元/积分 → 可用积分折现 ≈ ¥25.20。</text>
  <text x="20" y="662" fill="#cdd6f4" font-size="13" xml:space="preserve">  用它判断「这一单要不要动积分」——机会成本一目了然。</text>
  <text x="20" y="684" fill="#cdd6f4" font-size="13" xml:space="preserve"></text>
  <text x="20" y="706" fill="#89b4fa" font-size="13" xml:space="preserve">【沉默成本】临期券排程——回答「你正在白扔多少钱」</text>
