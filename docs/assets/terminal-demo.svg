  <text x="20" y="1322" fill="#cdd6f4" font-size="13" xml:space="preserve">  [meituan] 麦当劳满40减14代金券 ｜ 售价 ¥25.90 / 面值 ¥40.00 = 折扣率 64.8%</text>
  <text x="20" y="1344" fill="#cdd6f4" font-size="13" xml:space="preserve">  同内容估算到手 ¥30.11 ｜ 对比官方单点 ¥46.50 ｜ 建议用团购券（记得核对适用门店/时段与不可叠加限制）</text>
  <text x="20" y="1366" fill="#cdd6f4" font-size="13" xml:space="preserve">  估算口径：按面值比例折算到当前购物车内容；真实决策以各平台页面为准。</text>
